[project]
name = "pps"
version = "0.1.0"
description = "Prompt Protection Service: a local LLM judge for messages headed to coding agents, plus the shared secret scanner (pps.secrets)."
requires-python = ">=3.12"
# No runtime dependencies on purpose. The service is stdlib-only (stage 0 uses
# transformers/torch when present, from the models venv, not from here), and
# `pps.secrets` -- the part other projects import -- uses only the stdlib.
dependencies = []

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }
packages = ["pps"]
